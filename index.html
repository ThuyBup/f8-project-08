<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grocery Mart</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="./assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="./assets/favicon/site.webmanifest" />
    <!-- End favicon -->

    <!-- Embed font -->
    <link rel="stylesheet" href="./assets/fonts/stylesheet.css" />

    <!-- Main CSS -->
    <link rel="stylesheet" href="./assets/css/main.css" />

    <!-- Script -->
    <script src="./assets/js/scripts.js"></script>
  </head>
  <body>
    <header id="header" class="header"></header>
    <script>
      load("#header", "./template/header.html");
    </script>

    <div class="container home">
      <section class="home__container">
        <div class="slideshow">
          <div class="slideshow__inner">
            <div class="slideshow__item">
              <a href="#!" class="slideshow__link">
                <picture>
                  <source
                    media="(max-width: 768.98px)"
                    srcset="./assets/img/slideshow/item-1-md.png"
                  />
                  <img
                    src="./assets/img/slideshow/item-1.png"
                    alt=""
                    class="slideshow__img"
                  />
                </picture>
              </a>
            </div>
          </div>
          <div class="slideshow__page">
            <span class="slideshow__num">1</span>
            <div class="slideshow__line"></div>
            <span class="slideshow__num">5</span>
          </div>
        </div>
      </section>

      <!-- Browse Categories -->
      <section class="home__container">
        <div class="home__row">
          <h2 class="home__heading">Browse Categories</h2>
        </div>
        <div class="home__cate row row-cols-3 row-cols-md-1">
          <!-- Cate-item 1 -->
          <div class="col">
            <article class="cate-item">
              <img
                src="./assets/img/cate-item1.png"
                alt=""
                class="cate-item__thumb"
              />
              <section class="cate-item__info">
                <h3 class="cate-item__title">$24 - $150</h3>
                <p class="cate-item__desc">New sumatra mandeling coffe blend</p>
              </section>
            </article>
          </div>

          <!-- Cate-item 2 -->
          <div class="col">
            <article class="cate-item">
              <img
                src="./assets/img/cate-item2.png"
                alt=""
                class="cate-item__thumb"
              />
              <section class="cate-item__info">
                <h3 class="cate-item__title">$37 - $160</h3>
                <p class="cate-item__desc">
                  Espresso arabica and robusta beans
                </p>
              </section>
            </article>
          </div>

          <!-- Cate-item 3 -->
          <div class="col">
            <article class="cate-item">
              <img
                src="./assets/img/cate-item3.png"
                alt=""
                class="cate-item__thumb"
              />
              <section class="cate-item__info">
                <h3 class="cate-item__title">$32 - $160</h3>
                <p class="cate-item__desc">
                  Lavazza top class whole bean coffee blend
                </p>
              </section>
            </article>
          </div>
        </div>
      </section>
    </div>

    <footer id="footer"></footer>
    <script>
      load("#footer", "./template/footer.html");
    </script>
  </body>
</html>
